<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Artistic Swimming Analytics Dashboard</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Inter:wght@300;400;500;600;700&family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // FOUC prevention: apply persisted theme before first paint (DR-001)
      (function () {
        try {
          var stored = localStorage.getItem('theme-preference');
          var mode = stored || 'system';
          var dark =
            mode === 'dark' ||
            (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var theme = dark ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.setAttribute('color-scheme', theme);
        } catch (e) {
          // localStorage unavailable - fall back to default light theme
        }
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
