version: '3.8'

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  # The Supabase stack is NOT defined here. It is the self-hosted Docker Compose
  # project in ../supabase, started with `docker compose up -d` from that
  # directory - there is no Supabase CLI in this setup. This file only provides
  # Redis. See backend/GETTING_STARTED.md for the stack's host ports.

volumes:
  redis_data:
