# Supabase Configuration for Local Development
# Run `supabase init` to create this file, or copy this template

[api]
port = 54321
schemas = ["public", "storage", "graphql_public"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 16

[studio]
port = 54323

[inbucket]
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
file_size_limit = "50MiB"

[auth]
site_url = "http://localhost:4200"
additional_redirect_urls = ["http://localhost:4200/**"]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[auth.sms]
enable_signup = false

[auth.external]
# github_enabled = false
# google_enabled = false

[functions]
# verify_jwt = true

[edge_runtime]
policy = "deny"

[logs]
level = "info"

[realtime]
enabled = true
ip_version = "ipv4"
max_rows = 1000